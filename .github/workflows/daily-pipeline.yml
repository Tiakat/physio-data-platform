name: daily-physio-pipeline

on:
  schedule:
    # 12:00 UTC Mon-Fri = 08:00 EDT (07:00 EST in winter)
    - cron: "0 12 * * 1-5"
  workflow_dispatch:

concurrency:
  group: physio-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AZURE_STORAGE_ACCOUNT: labdataplatform
      AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
      DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
      DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
      PIPELINE_DATA_KEY: ${{ secrets.PIPELINE_DATA_KEY }}
      # Ingest ALL data projects (not just V-RAPS). Comma-separated codes or "all".
      LEGACY_PROJECTS: all
      # Encrypted-parquet ingest budget PER PROJECT per run (GB of source data).
      # Kept small (4): the runner was SIGTERM-killed (exit 143) on a 10.6 GB
      # DEXREM batch, likely disk exhaustion. One run walks ALL projects and
      # state is saved after each project, so scheduled runs resume on their own.
      LEGACY_BUDGET_GB: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run daily pipeline
        run: python -m tools.daily_pipeline
