name: daily-physio-pipeline

on:
  schedule:
    # 12:00 UTC Mon-Fri = 08:00 EDT (07:00 EST in winter)
    - cron: "0 12 * * 1-5"
  workflow_dispatch:
    inputs:
      rescan_unsupported:
        description: "Re-examine files previously marked unsupported (after adding a parser/profile)"
        required: false
        default: "0"
        type: choice
        options:
          - "0"
          - "1"

concurrency:
  group: physio-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write
    env:
      AZURE_STORAGE_ACCOUNT: labdataplatform
      AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
      DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
      DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
      PIPELINE_DATA_KEY: ${{ secrets.PIPELINE_DATA_KEY }}
      # Ingest ALL data projects (not just V-RAPS). Comma-separated codes or "all".
      LEGACY_PROJECTS: all
      # Encrypted-parquet ingest budget PER PROJECT per run (GB of source data).
      # Per-project source-data budget per run. Kept small (4): the runner was
      # SIGTERM-killed (exit 143) on large DEXREM batches. Each project's
      # selection is processed in INGEST_CHUNK_GB chunks (download -> parse ->
      # upload -> wipe), so peak disk stays near the chunk size even when
      # parsed parquet is much larger than the source files. Each chunk logs
      # free disk + available memory first, so a runner kill is diagnosable.
      LEGACY_BUDGET_GB: "4"
      INGEST_CHUNK_GB: "0.25"
      # One-shot rescan of unsupported files (dispatch with rescan_unsupported=1
      # after adding a new parser or project profile).
      RESCAN_UNSUPPORTED: ${{ inputs.rescan_unsupported || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run daily pipeline
        run: python -m tools.daily_pipeline
      # Supervisor report: filed as a GitHub issue ONLY when a project
      # deviates from the lab template (the pipeline writes
      # supervisor_out/body.txt only then). No email credentials needed:
      # GitHub notifies you through your normal repo notifications.
      # An existing open supervisor issue gets a new comment instead of
      # opening duplicates; close it once you've fixed the folders.
      - name: File supervisor report
        if: hashFiles('supervisor_out/body.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create supervisor --color "d73a4a" \
            --description "Lab-template deviations found by the supervisor" || true
          OPEN=$(gh issue list --label supervisor --state open --json number -q '.[0].number')
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body-file supervisor_out/body.txt
            echo "Updated issue #$OPEN"
          else
            gh issue create --label supervisor \
              --title "Supervisor: lab-template deviations" \
              --body-file supervisor_out/body.txt
            echo "Filed new supervisor issue"
          fi
  # ------------------------------------------------------------------
  # Stage 2 (phases 1-4): dataset discovery, integrity, column-level data
  # dictionary, linkage assessment. Reads the encrypted parquets from
  # rawdata, writes processed/stage2/. Separate job => its own 120-minute
  # timeout, independent of the ingest job.
  # ------------------------------------------------------------------
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: run
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run stage 2 discovery
        env:
          AZURE_STORAGE_ACCOUNT: labdataplatform
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
          PIPELINE_DATA_KEY: ${{ secrets.PIPELINE_DATA_KEY }}
          STAGE2_SAMPLE_N: "20"
        run: python -m tools.stage2_discovery
      # Stage 2 findings (e.g. identifier-class columns inside a standardized
      # parquet) go to a labeled issue, same pattern as the supervisor.
      - name: File stage 2 report
        if: hashFiles('stage2_out/body.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create stage2 --color "0e8a16" \
            --description "Findings from stage 2 processing" || true
          OPEN=$(gh issue list --label stage2 --state open --json number -q '.[0].number')
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body-file stage2_out/body.txt
            echo "Updated issue #$OPEN"
          else
            gh issue create --title "Stage 2: discovery findings $(date -u +%F)" \
              --body-file stage2_out/body.txt --label stage2
          fi
