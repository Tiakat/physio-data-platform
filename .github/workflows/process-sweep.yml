name: process-sweep

# Full per-patient processing across ALL projects and ALL files.
# Job 1 enumerates every encrypted parquet in rawdata; job 2 fans out
# with a matrix strategy, each worker processing a chunk of files via
# tools/process_patient.py (whole recording, real timestamps, all
# signals, lineage, gap-compressed graphs).
#
# K's directive: process everything -- differences within and across
# projects feed the bigger dictionary. No sampling.

on:
  workflow_dispatch:
    inputs:
      chunk_size:
        description: "Files per matrix worker"
        required: false
        default: "10"
      projects:
        description: "Comma-separated project codes, or 'all'"
        required: false
        default: "all"

jobs:
  enumerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      count: ${{ steps.build.outputs.count }}
    env:
      AZURE_STORAGE_ACCOUNT: labdataplatform
      AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build file matrix
        id: build
        run: |
          python -m tools.build_sweep_matrix \
            --projects "${{ inputs.projects }}" \
            --chunk-size "${{ inputs.chunk_size }}" \
            --out matrix.json
          echo "count=$(python -c "import json;print(len(json.load(open('matrix.json'))))")" >> "$GITHUB_OUTPUT"
          echo "matrix=$(python -c "import json;print(json.dumps(json.load(open('matrix.json'))))")" >> "$GITHUB_OUTPUT"
      - name: Upload matrix
        uses: actions/upload-artifact@v4
        with:
          name: sweep-matrix-${{ github.run_id }}
          path: matrix.json

  process:
    needs: enumerate
    if: needs.enumerate.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.enumerate.outputs.matrix) }}
    env:
      AZURE_STORAGE_ACCOUNT: labdataplatform
      AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
      PIPELINE_DATA_KEY: ${{ secrets.PIPELINE_DATA_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Process chunk
        run: |
          mkdir -p sweep_out
          python -m tools.process_sweep_chunk \
            --chunk '${{ toJSON(matrix.chunk) }}' \
            --out sweep_out
      - name: Upload sweep outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweep-${{ github.run_id }}-${{ strategy.job-index }}
          path: sweep_out/
          if-no-files-found: ignore
