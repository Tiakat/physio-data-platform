name: recon

# Manual, read-only reconnaissance. Tasks:
#   formats       -> what file extensions live in each project (Dropbox walk)
#   inventory-raw -> list legacy encrypted source-byte objects in Azure
#   layouts       -> per-project folder layout vs the lab template
#   schemas       -> header-only column census of raw CSVs
#   review-dictionary -> privacy-limited review of the census
#   demographics  -> locate per-project demographic Excel files
#   forensics     -> structural fingerprints of header-unparseable CSVs
#   pilot-scan    -> identifier value-scan on a few decrypted parquets
#                    (counts only, privacy-safe report)
#   fetch-recon   -> download a reports/recon/<prefix>/ prefix from Azure
#                    (for bringing census outputs back as an artifact)
#   pilot-filter  -> Phase 9+ filtering pilot on a few decrypted parquets
#                    (draft intervals; filtered CSV + QC + PNG graph)
#   restructure-azure -> K's 4-container layout (raw/processed/graphes/analysis)
#                    decrypts parquets to CSV, migrates graphs; old containers
#                    untouched. Sample-first via restructure_project input.
#   erase-old        -> deletes old containers (rawdata, processed, graphs,
#                    reports, filtered-csv) + swaps processed_new -> processed.
#                    Requires erase_confirm=YES-DELETE-OLD; runs only after K
#                    verifies the new containers.
#   build-1raw       -> K's clean restart: builds the 1-Raw container with
#                    structure 1-Raw/{PROJECT}/{patient}/{device}/{file}.csv.
#                    Real Dropbox patient names, device subfolders, all CSVs
#                    with text/csv for browser preview. Sample-first via
#                    build1raw_project input.
#   erase-all        -> deletes EVERYTHING except 1-Raw. K's clean restart:
#                    "all the other containers erase them we will start from
#                    new". Requires erase_all_confirm=YES-ERASE-ALL; runs only
#                    after K verifies 1-Raw.
# Neither task moves, renames, or deletes anything.

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Recon task"
        required: true
        default: "formats"
        type: choice
        options:
          - formats
          - inventory-raw
          - layouts
          - schemas
          - review-dictionary
          - demographics
          - forensics
          - pilot-scan
          - fetch-recon
          - filter-pilot
          - process-patient
          - fetch-shared
          - ml-unsup-train
          - ml-sup-train
          - find-labels
          - verify-processing
          - fetch-graphs
          - make-graphs-container
          - validate-processing
          - train-graph-validator
          - validate-external
          - qc-notify
          - audit-supervisors
          - continuity-check
          - meta-supervisor
          - export-csv
          - migrate-graphs
          - detect-overfilter
          - ml-feedback
          - fetch-new-graphs
          - count-graphs
          - smart-filter-pilot
          - ml-incremental
          - build-promises-labels
          - eval-unsupervised
          - ssl-pretrain
          - ssl-finetune
          - compare-models
          - fetch-dict
          - azure-inventory
          - find-complete-patient
          - find-golden-patient
          - ingest-progress
          - verify-ingest
          - diagnose-blobs
          - identifier-columns
          - signal-presence
          - restructure-azure
          - erase-old
          - build-1raw
          - erase-all
          - pipeline-chain
          - pipeline-stage
      fetch_prefix:
        description: "Blob prefix for fetch-recon (e.g. recon/schemas_20261001_2012/)"
        required: false
        default: ""
      pp_project:
        description: "process-patient: project code (e.g. DEXREM)"
        required: false
        default: ""
      pp_patient:
        description: "process-patient: patient label (e.g. patient 1)"
        required: false
        default: ""
      pp_blob:
        description: "process-patient: encrypted parquet blob path"
        required: false
        default: ""
      shared_url:
        description: "fetch-shared: Dropbox shared link URL"
        required: false
        default: ""
      ml_project:
        description: "ml train: project code"
        required: false
        default: ""
      ml_signal:
        description: "ml-sup-train: signal name"
        required: false
        default: ""
      migrate_project:
        description: "migrate-graphs: project code"
        required: false
        default: ""
      restructure_project:
        description: "restructure-azure: project code, or 'all'"
        required: false
        default: "COLECTOMIE"
      restructure_erase_wrong:
        description: "restructure-azure: set to 1 to delete blobs with provisional patient names first"
        required: false
        default: "0"
      erase_confirm:
        description: "erase-old: must be YES-DELETE-OLD to run"
        required: false
        default: ""
      build1raw_project:
        description: "build-1raw: project code, or 'all'"
        required: false
        default: "COLECTOMIE"
      erase_all_confirm:
        description: "erase-all: must be YES-ERASE-ALL to run"
        required: false
        default: ""
      chain_project:
        description: "Project for pipeline-chain (default all)"
        required: false
        default: "all"
      chain_stage:
        description: "Stage(s) for pipeline-stage: all or e.g. 2,3"
        required: false
        default: "all"
      eval_project:
        description: "eval-unsupervised: project code"
        required: false
        default: "DEXREM"
      ssl_signal:
        description: "ssl-pretrain/ssl-finetune/compare-models: signal name (e.g. ART)"
        required: false
        default: "ART"
      ssl_max_files:
        description: "ssl tasks: max parquet files to use (pilot scale)"
        required: false
        default: "100"
      ssl_epochs:
        description: "ssl tasks: training epochs"
        required: false
        default: "10"
      ssl_pretrained:
        description: "ssl-finetune: encoder .pt path in ml_out/ssl (blank = from scratch)"
        required: false
        default: ""

concurrency:
  group: physio-recon
  cancel-in-progress: false

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      AZURE_STORAGE_ACCOUNT: labdataplatform
      AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
      DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
      DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
      PIPELINE_DATA_KEY: ${{ secrets.PIPELINE_DATA_KEY }}
      LEGACY_PROJECTS: all
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run recon
        run: |
          if [ "${{ inputs.task }}" = "formats" ]; then
            python -m tools.recon_formats
          elif [ "${{ inputs.task }}" = "inventory-raw" ]; then
            python -m tools.recon_raw_inventory
          elif [ "${{ inputs.task }}" = "schemas" ]; then
            python -m tools.recon_schemas
          elif [ "${{ inputs.task }}" = "review-dictionary" ]; then
            python -m tools.review_dictionary
          elif [ "${{ inputs.task }}" = "demographics" ]; then
            python -m tools.recon_demographics
          elif [ "${{ inputs.task }}" = "forensics" ]; then
            python -m tools.recon_forensics
          elif [ "${{ inputs.task }}" = "pilot-scan" ]; then
            mkdir -p recon_out
            python -m tools.pilot_scan --per-project 2 --max-total 12 \
              --report recon_out/pilot_scan.json || \
              echo "pilot-scan exited $? (2 = findings need review)"
          elif [ "${{ inputs.task }}" = "fetch-recon" ]; then
            if [ -z "${{ inputs.fetch_prefix }}" ]; then
              echo "fetch-recon needs the fetch_prefix input"; exit 1
            fi
            python -m tools.fetch_recon \
              --prefix "${{ inputs.fetch_prefix }}" --out fetched
          elif [ "${{ inputs.task }}" = "filter-pilot" ]; then
            mkdir -p filter_pilot_out
            python -m tools.pilot_filter --per-project 1 --max-total 3 \
              --signals HR,SPO2 --max-rows 20000 --out filter_pilot_out
          elif [ "${{ inputs.task }}" = "process-patient" ]; then
            mkdir -p processed_out
            python -m tools.process_patient \
              --project "${{ inputs.pp_project }}" \
              --patient "${{ inputs.pp_patient }}" \
              --blob "${{ inputs.pp_blob }}" \
              --out processed_out
          elif [ "${{ inputs.task }}" = "smart-filter-pilot" ]; then
            mkdir -p smart_pilot_out
            USE_SMART_FILTER=1 python -m tools.process_patient \
              --project "${{ inputs.pp_project }}" \
              --patient "${{ inputs.pp_patient }}" \
              --blob "${{ inputs.pp_blob }}" \
              --out smart_pilot_out
          elif [ "${{ inputs.task }}" = "fetch-shared" ]; then
            mkdir -p shared_out
            python -m tools.fetch_shared_zip \
              --url "${{ inputs.shared_url }}" \
              --out shared_out
          elif [ "${{ inputs.task }}" = "ml-unsup-train" ]; then
            mkdir -p ml_out processed_dl
            # Support comma-separated projects in ml_project (e.g. "IPAMS,SILVR")
            # to avoid GitHub cancelling rapid sequential dispatches.
            IFS=',' read -ra PROJS <<< "${{ inputs.ml_project }}"
            for PROJ in "${PROJS[@]}"; do
              PROJ=$(echo "$PROJ" | xargs)
              echo "[ml-unsup] === Processing project: $PROJ ==="
              rm -rf processed_dl && mkdir -p processed_dl
              az storage blob download-batch \
                --account-name labdataplatform \
                --source processed \
                --pattern "processed/level2/${PROJ}/*" \
                --destination processed_dl \
                --auth-mode key --account-key "${{ secrets.AZURE_STORAGE_KEY }}"
              python -m tools.ml_unsupervised_train \
                --project "$PROJ" \
                --parquet-dir processed_dl \
                --out "ml_out/$PROJ"
            done
            # Durable model store (artifacts expire after 90 days).
            # Upload each project's models to its own Azure path
            IFS=',' read -ra PROJS <<< "${{ inputs.ml_project }}"
            for PROJ in "${PROJS[@]}"; do
              PROJ=$(echo "$PROJ" | xargs)
              if [ -d "ml_out/$PROJ" ]; then
                az storage blob upload-batch \
                  --account-name labdataplatform \
                  --source "ml_out/$PROJ" --destination processed \
                  --destination-path "ml_models/unsup/${PROJ}/" \
                  --auth-mode key --account-key "${{ secrets.AZURE_STORAGE_KEY }}" \
                  --overwrite
              fi
            done
          elif [ "${{ inputs.task }}" = "ingest-progress" ]; then
            echo "=== DEXREM progress ==="
            COUNT=$(az storage blob list \
              --account-name labdataplatform \
              --container-name rawdata \
              --prefix "DEXREM/parquet/" \
              --auth-mode key --account-key "${{ secrets.AZURE_STORAGE_KEY }}" \
              --query "length(@)")
            PCT=$(python3 -c "print(f'{int($COUNT)/257*100:.1f}')")
            MSG="Phase 1 DEXREM: $COUNT/257 blobs ($PCT%)"
            echo "$MSG"
            gh issue create --title "Ingest Progress: $MSG" \
              --body "$MSG - $(date -u)" --label "ingest-progress" 2>/dev/null || \
            gh issue comment --body "$MSG - $(date -u)" 1 2>/dev/null || true
            python3 -c "c=int('$COUNT'); print(f'Phase 1: {c}/257 = {c/257*100:.1f}%')"
          elif [ "${{ inputs.task }}" = "verify-ingest" ]; then
            python -m tools.verify_ingest
          elif [ "${{ inputs.task }}" = "diagnose-blobs" ]; then
            python -m tools.verify_ingest --diagnose DEXREM
            python -m tools.verify_ingest --diagnose ESMONOL
            python -m tools.verify_ingest --diagnose IPAMS
            python -m tools.verify_ingest --diagnose PROMISES
          elif [ "${{ inputs.task }}" = "identifier-columns" ]; then
            # Issue #2: list identifier-class column NAMES per project
            # (names only, no values — privacy-safe). Feeds K's review of
            # the de-identified website feed gate.
            python -m tools.dump_identifier_columns
          elif [ "${{ inputs.task }}" = "signal-presence" ]; then
            # Issue #2: full signal-presence census from parquet footers
            # (replaces the 20-file sampled "entirely missing" findings
            # with complete per-project/per-device/per-column counts).
            mkdir -p presence_out
            python -m tools.signal_presence_scan --out presence_out/
          elif [ "${{ inputs.task }}" = "find-golden-patient" ]; then
            mkdir -p patient_out
            python -m tools.find_golden_patient --out patient_out/
          elif [ "${{ inputs.task }}" = "find-complete-patient" ]; then
            mkdir -p patient_out
            python -m tools.find_complete_patient --out patient_out/ 2>&1 | head -50
          elif [ "${{ inputs.task }}" = "azure-inventory" ]; then
            mkdir -p inv_out
            for container in rawdata processed; do
              echo "=== $container ==="
              az storage blob list \
                --account-name labdataplatform \
                --container-name $container \
                --auth-mode key --account-key "${{ secrets.AZURE_STORAGE_KEY }}" \
                --query "[].{name:name}" -o tsv | \
                cut -d/ -f1,2 | sort | uniq -c | sort -rn | head -30
            done > inv_out/inventory.txt
            cat inv_out/inventory.txt
          elif [ "${{ inputs.task }}" = "fetch-dict" ]; then
            mkdir -p dict_out
            az storage blob list \
              --account-name labdataplatform \
              --container-name reports \
              --prefix dictionary/ \
              --auth-mode key --account-key "${{ secrets.AZURE_STORAGE_KEY }}" \
              --query "[].name" -o tsv | head -20
          elif [ "${{ inputs.task }}" = "ml-incremental" ]; then
            mkdir -p ml_out
            python -m tools.ml_incremental \
              --out ml_out \
              --manifest ml_out/training_manifest.json
          elif [ "${{ inputs.task }}" = "build-promises-labels" ]; then
            mkdir -p labels_out
            pip install requests pandas -q
            DROPBOX_APP_KEY="${{ secrets.DROPBOX_APP_KEY }}" \
            DROPBOX_APP_SECRET="${{ secrets.DROPBOX_APP_SECRET }}" \
            DROPBOX_REFRESH_TOKEN="${{ secrets.DROPBOX_REFRESH_TOKEN }}" \
            python -m tools.build_promises_labels --out labels_out/promises_labels.csv
            # Upload to Azure (private, NOT the public repo)
            az storage blob upload \
              --account-name labdataplatform \
              --container-name processed \
              --name "ml_models/promises_labels.csv" \
              --file labels_out/promises_labels.csv \
              --auth-mode key --account-key "${{ secrets.AZURE_STORAGE_KEY }}" \
              --overwrite
            cp labels_out/promises_labels.csv ./promises_labels_artifact.csv
          elif [ "${{ inputs.task }}" = "eval-unsupervised" ]; then
            mkdir -p eval_out processed_dl
            az storage blob download-batch \
              --account-name labdataplatform \
              --source processed \
              --pattern "processed/level2/${{ inputs.eval_project }}/*" \
              --destination processed_dl \
              --auth-mode key --account-key "${{ secrets.AZURE_STORAGE_KEY }}"
            python -m tools.evaluate_unsupervised \
              --project "${{ inputs.eval_project }}" \
              --parquet-dir processed_dl \
              --out eval_out
          elif [ "${{ inputs.task }}" = "ml-sup-train" ]; then
            mkdir -p ml_out processed_dl
            az storage blob download-batch \
              --account-name labdataplatform \
              --source processed \
              --pattern "processed/level2/*/*" \
              --destination processed_dl \
              --auth-mode key --account-key "${{ secrets.AZURE_STORAGE_KEY }}"
            LABELS_ARG=""
            if [ -f data/labels/promises_labels.csv ]; then
              LABELS_ARG="--labels-csv data/labels/promises_labels.csv"
            fi
            python -m tools.ml_supervised_train \
              --signal "${{ inputs.ml_signal }}" \
              --parquet-dir processed_dl \
              --out ml_out \
              $LABELS_ARG
            # Durable model store (artifacts expire after 90 days).
            az storage blob upload-batch \
              --account-name labdataplatform \
              --source ml_out --destination processed \
              --destination-path "ml_models/sup/${{ inputs.ml_signal }}/" \
              --auth-mode key --account-key "${{ secrets.AZURE_STORAGE_KEY }}" \
              --overwrite
          elif [ "${{ inputs.task }}" = "find-labels" ]; then
            pip install requests -q
            DROPBOX_APP_KEY="${{ secrets.DROPBOX_APP_KEY }}" \
            DROPBOX_APP_SECRET="${{ secrets.DROPBOX_APP_SECRET }}" \
            DROPBOX_REFRESH_TOKEN="${{ secrets.DROPBOX_REFRESH_TOKEN }}" \
            python -m tools.find_labels
          elif [ "${{ inputs.task }}" = "verify-processing" ]; then
            python -m tools.verify_processing
          elif [ "${{ inputs.task }}" = "fetch-graphs" ]; then
            python -m tools.fetch_sample_graphs
          elif [ "${{ inputs.task }}" = "make-graphs-container" ]; then
            python -m tools.make_graphs_container
          elif [ "${{ inputs.task }}" = "validate-processing" ]; then
            python -m tools.validate_processing
          elif [ "${{ inputs.task }}" = "train-graph-validator" ]; then
            mkdir -p ml_out processed_dl
            az storage blob download-batch \
              --account-name labdataplatform \
              --source processed \
              --pattern "processed/level2/*/*" \
              --destination processed_dl \
              --auth-mode key --account-key "${{ secrets.AZURE_STORAGE_KEY }}"
            python -m tools.train_graph_validator \
              --parquet-dir processed_dl \
              --out ml_out \
              --labels-csv data/labels/promises_labels.csv
            # Durable model store (artifacts expire after 90 days).
            az storage blob upload-batch \
              --account-name labdataplatform \
              --source ml_out --destination processed \
              --destination-path "ml_models/graph_validator/" \
              --auth-mode key --account-key "${{ secrets.AZURE_STORAGE_KEY }}" \
              --overwrite
          elif [ "${{ inputs.task }}" = "validate-external" ]; then
            python -m tools.validate_external
          elif [ "${{ inputs.task }}" = "audit-supervisors" ]; then
            python -m tools.audit_supervisors
          elif [ "${{ inputs.task }}" = "continuity-check" ]; then
            python -m tools.continuity_check
          elif [ "${{ inputs.task }}" = "meta-supervisor" ]; then
            python -m tools.meta_supervisor
          elif [ "${{ inputs.task }}" = "export-csv" ]; then
            python -m tools.export_filtered_csv
          elif [ "${{ inputs.task }}" = "migrate-graphs" ]; then
            python -m tools.migrate_graphs --project "${{ inputs.migrate_project }}"
          elif [ "${{ inputs.task }}" = "detect-overfilter" ]; then
            python -m tools.detect_overfilter
          elif [ "${{ inputs.task }}" = "ml-feedback" ]; then
            python -m tools.ml_feedback
          elif [ "${{ inputs.task }}" = "fetch-new-graphs" ]; then
            python -m tools.fetch_new_graphs
          elif [ "${{ inputs.task }}" = "count-graphs" ]; then
            python -m tools.count_graphs --overfilter-report overfilter/report.json
          elif [ "${{ inputs.task }}" = "restructure-azure" ]; then
            # K's 4-container restructure: raw/processed/graphes/analysis.
            # Sample-first: default input is COLECTOMIE; run with 'all' after.
            mkdir -p restructure_out
            ERASE_FLAG=""
            if [ "${{ inputs.restructure_erase_wrong }}" = "1" ]; then
              ERASE_FLAG="--erase-wrong"
            fi
            python -m tools.restructure_azure \
              --project "${{ inputs.restructure_project }}" \
              --out restructure_out $ERASE_FLAG
          elif [ "${{ inputs.task }}" = "erase-old" ]; then
            # Deletes old containers ONLY with explicit confirmation token.
            # Runs only after K verifies the 4 new containers.
            python -m tools.erase_old_containers \
              --confirm "${{ inputs.erase_confirm }}"
          elif [ "${{ inputs.task }}" = "build-1raw" ]; then
            # K's clean restart: 1-Raw/{PROJECT}/{patient}/{device}/{file}.csv.
            # Real Dropbox patient names, device subfolders, CSVs with
            # text/csv for browser preview. Sample-first: default COLECTOMIE.
            mkdir -p 1raw_out
            python -m tools.build_1raw \
              --project "${{ inputs.build1raw_project }}" \
              --out 1raw_out
          elif [ "${{ inputs.task }}" = "erase-all" ]; then
            # Deletes EVERYTHING except 1-Raw. ONLY with explicit token.
            # Runs only after K verifies 1-Raw.
            python -m tools.erase_all_except_1raw \
              --confirm "${{ inputs.erase_all_confirm }}"
          elif [ "${{ inputs.task }}" = "ssl-pretrain" ]; then
            # Self-supervised contrastive pretraining on unlabeled windows.
            # Pilot scale: 100 files by default; scale up after verification.
            pip install torch --index-url https://download.pytorch.org/whl/cpu -q
            mkdir -p ssl_out processed_dl
            az storage blob download-batch \
              --account-name labdataplatform \
              --source processed \
              --pattern "processed/level2/*/*" \
              --destination processed_dl \
              --auth-mode key --account-key "${{ secrets.AZURE_STORAGE_KEY }}"
            python -m tools.ssl_transformer --mode pretrain \
              --parquet-dir processed_dl --out ssl_out \
              --signal "${{ inputs.ssl_signal }}" \
              --max-files "${{ inputs.ssl_max_files }}" \
              --epochs "${{ inputs.ssl_epochs }}" --device cpu
            az storage blob upload-batch \
              --account-name labdataplatform \
              --source ssl_out --destination processed \
              --destination-path "ml_models/ssl/" \
              --auth-mode key --account-key "${{ secrets.AZURE_STORAGE_KEY }}" \
              --overwrite
          elif [ "${{ inputs.task }}" = "ssl-finetune" ]; then
            # Fine-tune (pretrained encoder or from scratch) on labels.
            pip install torch --index-url https://download.pytorch.org/whl/cpu -q
            mkdir -p ssl_out processed_dl
            az storage blob download-batch \
              --account-name labdataplatform \
              --source processed \
              --pattern "processed/level2/*/*" \
              --destination processed_dl \
              --auth-mode key --account-key "${{ secrets.AZURE_STORAGE_KEY }}"
            LABELS_ARG=""
            if [ -f data/labels/promises_labels.csv ]; then
              LABELS_ARG="--labels-csv data/labels/promises_labels.csv"
            fi
            elif [ "${{ inputs.task }}" = "pipeline-chain" ]; then
              echo "=== PIPELINE CHAIN (all stages) ==="
              python -m tools.pipeline_chain --stage all \
                --project "${{ inputs.chain_project }}" --out chain_out
            elif [ "${{ inputs.task }}" = "pipeline-stage" ]; then
              echo "=== PIPELINE STAGE ${{ inputs.chain_stage }} ==="
              python -m tools.pipeline_chain --stage "${{ inputs.chain_stage }}" \
                --project "${{ inputs.chain_project }}" --out chain_out
            # Pull pretrained encoder if requested.
            PRE_ARG=""
            if [ -n "${{ inputs.ssl_pretrained }}" ]; then
              az storage blob download \
                --account-name labdataplatform \
                --container-name processed \
                --name "ml_models/ssl/${{ inputs.ssl_pretrained }}" \
                --file "ssl_out/${{ inputs.ssl_pretrained }}" \
                --auth-mode key --account-key "${{ secrets.AZURE_STORAGE_KEY }}" \
                || echo "pretrained encoder download failed; training from scratch"
              PRE_ARG="--pretrained ssl_out/${{ inputs.ssl_pretrained }}"
            fi
            python -m tools.ssl_transformer --mode finetune \
              --parquet-dir processed_dl --out ssl_out \
              --signal "${{ inputs.ssl_signal }}" $PRE_ARG $LABELS_ARG \
              --max-files "${{ inputs.ssl_max_files }}" \
              --epochs "${{ inputs.ssl_epochs }}" --device cpu
            az storage blob upload-batch \
              --account-name labdataplatform \
              --source ssl_out --destination processed \
              --destination-path "ml_models/ssl/" \
              --auth-mode key --account-key "${{ secrets.AZURE_STORAGE_KEY }}" \
              --overwrite
          elif [ "${{ inputs.task }}" = "compare-models" ]; then
            # Head-to-head: RF vs 1D-CNN vs Transformer vs SSL-Transformer.
            pip install torch --index-url https://download.pytorch.org/whl/cpu -q
            mkdir -p ssl_out processed_dl
            az storage blob download-batch \
              --account-name labdataplatform \
              --source processed \
              --pattern "processed/level2/*/*" \
              --destination processed_dl \
              --auth-mode key --account-key "${{ secrets.AZURE_STORAGE_KEY }}"
            LABELS_ARG=""
            if [ -f data/labels/promises_labels.csv ]; then
              LABELS_ARG="--labels-csv data/labels/promises_labels.csv"
            fi
            python -m tools.compare_models \
              --parquet-dir processed_dl --out ssl_out \
              --signal "${{ inputs.ssl_signal }}" $LABELS_ARG \
              --max-files "${{ inputs.ssl_max_files }}" \
              --epochs "${{ inputs.ssl_epochs }}" --device cpu
            az storage blob upload-batch \
              --account-name labdataplatform \
              --source ssl_out --destination processed \
              --destination-path "ml_models/ssl/" \
              --auth-mode key --account-key "${{ secrets.AZURE_STORAGE_KEY }}" \
              --overwrite
          elif [ "${{ inputs.task }}" = "qc-notify" ]; then
            python -m tools.qc_notifier | tee qc_notifier.log
            N=$(grep -oP '^QC_ISSUES_FOUND=\K[0-9]+' qc_notifier.log || echo 0)
            echo "QC findings: $N"
            if [ "$N" -gt 0 ]; then
              TITLE="QC Alert: $N data-quality findings across processed patients"
              # Reuse the open qc-alert issue instead of creating duplicates.
              EXISTING=$(gh issue list --label "qc-alert" --state open \
                --json number --jq '.[0].number' 2>/dev/null || echo "")
              if [ -n "$EXISTING" ]; then
                echo "Updating existing qc-alert issue #$EXISTING"
                gh issue edit "$EXISTING" --title "$TITLE" \
                  --body-file qc_report/summary.md
                gh issue comment "$EXISTING" --body \
                  "QC re-scan $(date -u): $N findings (see updated issue body)."
              else
                echo "Creating new qc-alert issue"
                gh issue create --title "$TITLE" \
                  --body-file qc_report/summary.md --label "qc-alert"
              fi
            else
              echo "No QC issues - no notification needed."
            fi
          else
            python -m tools.recon_layouts
          fi
      - name: Upload recon outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recon-${{ inputs.task }}-${{ github.run_id }}
          path: |
            recon_out/
            presence_out/
            fetched/
            filter_pilot_out/
            graph_samples/
            validation_report/
            overfilter/
            ml_feedback/
            external_validation_report/
            qc_report/
            supervisor_audit/
            continuity/
            meta_supervisor/
            processed_out/
            shared_out/
            ml_out/
            new_graph_samples/
            smart_pilot_out/
            dict_out/
            inv_out/
            patient_out/
            restructure_out/
            ssl_out/
            1raw_out/
              chain_out/
          if-no-files-found: ignore
