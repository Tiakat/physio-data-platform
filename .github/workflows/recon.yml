name: recon

# Manual, read-only reconnaissance. Tasks:
#   formats       -> what file extensions live in each project (Dropbox walk)
#   inventory-raw -> list legacy encrypted source-byte objects in Azure
#   layouts       -> per-project folder layout vs the lab template
#   schemas       -> header-only column census of raw CSVs
#   review-dictionary -> privacy-limited review of the census
#   demographics  -> locate per-project demographic Excel files
#   forensics     -> structural fingerprints of header-unparseable CSVs
#   pilot-scan    -> identifier value-scan on a few decrypted parquets
#                    (counts only, privacy-safe report)
#   fetch-recon   -> download a reports/recon/<prefix>/ prefix from Azure
#                    (for bringing census outputs back as an artifact)
#   pilot-filter  -> Phase 9+ filtering pilot on a few decrypted parquets
#                    (draft intervals; filtered CSV + QC + PNG graph)
# Neither task moves, renames, or deletes anything.

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Recon task"
        required: true
        default: "formats"
        type: choice
        options:
          - formats
          - inventory-raw
          - layouts
          - schemas
          - review-dictionary
          - demographics
          - forensics
          - pilot-scan
          - fetch-recon
          - filter-pilot
          - process-patient
          - fetch-shared
          - ml-unsup-train
          - ml-sup-train
          - find-labels
          - ml-incremental
          - fetch-dict
          - azure-inventory
          - find-complete-patient
          - find-golden-patient
          - ingest-progress
          - verify-ingest
          - diagnose-blobs
          - identifier-columns
          - signal-presence
      fetch_prefix:
        description: "Blob prefix for fetch-recon (e.g. recon/schemas_20261001_2012/)"
        required: false
        default: ""
      pp_project:
        description: "process-patient: project code (e.g. DEXREM)"
        required: false
        default: ""
      pp_patient:
        description: "process-patient: patient label (e.g. patient 1)"
        required: false
        default: ""
      pp_blob:
        description: "process-patient: encrypted parquet blob path"
        required: false
        default: ""
      shared_url:
        description: "fetch-shared: Dropbox shared link URL"
        required: false
        default: ""
      ml_project:
        description: "ml train: project code"
        required: false
        default: ""
      ml_signal:
        description: "ml-sup-train: signal name"
        required: false
        default: ""

concurrency:
  group: physio-recon
  cancel-in-progress: false

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      AZURE_STORAGE_ACCOUNT: labdataplatform
      AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
      DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
      DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
      PIPELINE_DATA_KEY: ${{ secrets.PIPELINE_DATA_KEY }}
      LEGACY_PROJECTS: all
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run recon
        run: |
          if [ "${{ inputs.task }}" = "formats" ]; then
            python -m tools.recon_formats
          elif [ "${{ inputs.task }}" = "inventory-raw" ]; then
            python -m tools.recon_raw_inventory
          elif [ "${{ inputs.task }}" = "schemas" ]; then
            python -m tools.recon_schemas
          elif [ "${{ inputs.task }}" = "review-dictionary" ]; then
            python -m tools.review_dictionary
          elif [ "${{ inputs.task }}" = "demographics" ]; then
            python -m tools.recon_demographics
          elif [ "${{ inputs.task }}" = "forensics" ]; then
            python -m tools.recon_forensics
          elif [ "${{ inputs.task }}" = "pilot-scan" ]; then
            mkdir -p recon_out
            python -m tools.pilot_scan --per-project 2 --max-total 12 \
              --report recon_out/pilot_scan.json || \
              echo "pilot-scan exited $? (2 = findings need review)"
          elif [ "${{ inputs.task }}" = "fetch-recon" ]; then
            if [ -z "${{ inputs.fetch_prefix }}" ]; then
              echo "fetch-recon needs the fetch_prefix input"; exit 1
            fi
            python -m tools.fetch_recon \
              --prefix "${{ inputs.fetch_prefix }}" --out fetched
          elif [ "${{ inputs.task }}" = "filter-pilot" ]; then
            mkdir -p filter_pilot_out
            python -m tools.pilot_filter --per-project 1 --max-total 3 \
              --signals HR,SPO2 --max-rows 20000 --out filter_pilot_out
          elif [ "${{ inputs.task }}" = "process-patient" ]; then
            mkdir -p processed_out
            python -m tools.process_patient \
              --project "${{ inputs.pp_project }}" \
              --patient "${{ inputs.pp_patient }}" \
              --blob "${{ inputs.pp_blob }}" \
              --out processed_out
          elif [ "${{ inputs.task }}" = "fetch-shared" ]; then
            mkdir -p shared_out
            python -m tools.fetch_shared_zip \
              --url "${{ inputs.shared_url }}" \
              --out shared_out
          elif [ "${{ inputs.task }}" = "ml-unsup-train" ]; then
            mkdir -p ml_out processed_dl
            # Support comma-separated projects in ml_project (e.g. "IPAMS,SILVR")
            # to avoid GitHub cancelling rapid sequential dispatches.
            IFS=',' read -ra PROJS <<< "${{ inputs.ml_project }}"
            for PROJ in "${PROJS[@]}"; do
              PROJ=$(echo "$PROJ" | xargs)
              echo "[ml-unsup] === Processing project: $PROJ ==="
              rm -rf processed_dl && mkdir -p processed_dl
              az storage blob download-batch \
                --account-name labdataplatform \
                --source processed \
                --pattern "processed/level2/${PROJ}/*" \
                --destination processed_dl \
                --auth-mode key --account-key "${{ secrets.AZURE_STORAGE_KEY }}"
              python -m tools.ml_unsupervised_train \
                --project "$PROJ" \
                --parquet-dir processed_dl \
                --out "ml_out/$PROJ"
            done
            # Durable model store (artifacts expire after 90 days).
            # Upload each project's models to its own Azure path
            IFS=',' read -ra PROJS <<< "${{ inputs.ml_project }}"
            for PROJ in "${PROJS[@]}"; do
              PROJ=$(echo "$PROJ" | xargs)
              if [ -d "ml_out/$PROJ" ]; then
                az storage blob upload-batch \
                  --account-name labdataplatform \
                  --source "ml_out/$PROJ" --destination processed \
                  --destination-path "ml_models/unsup/${PROJ}/" \
                  --auth-mode key --account-key "${{ secrets.AZURE_STORAGE_KEY }}" \
                  --overwrite
              fi
            done
          elif [ "${{ inputs.task }}" = "ingest-progress" ]; then
            echo "=== DEXREM progress ==="
            COUNT=$(az storage blob list \
              --account-name labdataplatform \
              --container-name rawdata \
              --prefix "DEXREM/parquet/" \
              --auth-mode key --account-key "${{ secrets.AZURE_STORAGE_KEY }}" \
              --query "length(@)")
            PCT=$(python3 -c "print(f'{int($COUNT)/257*100:.1f}')")
            MSG="Phase 1 DEXREM: $COUNT/257 blobs ($PCT%)"
            echo "$MSG"
            gh issue create --title "Ingest Progress: $MSG" \
              --body "$MSG - $(date -u)" --label "ingest-progress" 2>/dev/null || \
            gh issue comment --body "$MSG - $(date -u)" 1 2>/dev/null || true
            python3 -c "c=int('$COUNT'); print(f'Phase 1: {c}/257 = {c/257*100:.1f}%')"
          elif [ "${{ inputs.task }}" = "verify-ingest" ]; then
            python -m tools.verify_ingest
          elif [ "${{ inputs.task }}" = "diagnose-blobs" ]; then
            python -m tools.verify_ingest --diagnose DEXREM
            python -m tools.verify_ingest --diagnose ESMONOL
            python -m tools.verify_ingest --diagnose IPAMS
            python -m tools.verify_ingest --diagnose PROMISES
          elif [ "${{ inputs.task }}" = "identifier-columns" ]; then
            # Issue #2: list identifier-class column NAMES per project
            # (names only, no values — privacy-safe). Feeds K's review of
            # the de-identified website feed gate.
            python -m tools.dump_identifier_columns
          elif [ "${{ inputs.task }}" = "signal-presence" ]; then
            # Issue #2: full signal-presence census from parquet footers
            # (replaces the 20-file sampled "entirely missing" findings
            # with complete per-project/per-device/per-column counts).
            mkdir -p presence_out
            python -m tools.signal_presence_scan --out presence_out/
          elif [ "${{ inputs.task }}" = "find-golden-patient" ]; then
            mkdir -p patient_out
            python -m tools.find_golden_patient --out patient_out/
          elif [ "${{ inputs.task }}" = "find-complete-patient" ]; then
            mkdir -p patient_out
            python -m tools.find_complete_patient --out patient_out/ 2>&1 | head -50
          elif [ "${{ inputs.task }}" = "azure-inventory" ]; then
            mkdir -p inv_out
            for container in rawdata processed; do
              echo "=== $container ==="
              az storage blob list \
                --account-name labdataplatform \
                --container-name $container \
                --auth-mode key --account-key "${{ secrets.AZURE_STORAGE_KEY }}" \
                --query "[].{name:name}" -o tsv | \
                cut -d/ -f1,2 | sort | uniq -c | sort -rn | head -30
            done > inv_out/inventory.txt
            cat inv_out/inventory.txt
          elif [ "${{ inputs.task }}" = "fetch-dict" ]; then
            mkdir -p dict_out
            az storage blob list \
              --account-name labdataplatform \
              --container-name reports \
              --prefix dictionary/ \
              --auth-mode key --account-key "${{ secrets.AZURE_STORAGE_KEY }}" \
              --query "[].name" -o tsv | head -20
          elif [ "${{ inputs.task }}" = "ml-incremental" ]; then
            mkdir -p ml_out
            python -m tools.ml_incremental \
              --out ml_out \
              --manifest ml_out/training_manifest.json
          elif [ "${{ inputs.task }}" = "ml-sup-train" ]; then
            mkdir -p ml_out processed_dl
            az storage blob download-batch \
              --account-name labdataplatform \
              --source processed \
              --pattern "processed/level2/*/*" \
              --destination processed_dl \
              --auth-mode key --account-key "${{ secrets.AZURE_STORAGE_KEY }}"
            python -m tools.ml_supervised_train \
              --signal "${{ inputs.ml_signal }}" \
              --parquet-dir processed_dl \
              --out ml_out \
              --labels-csv data/labels/promises_labels.csv
            # Durable model store (artifacts expire after 90 days).
            az storage blob upload-batch \
              --account-name labdataplatform \
              --source ml_out --destination processed \
              --destination-path "ml_models/sup/${{ inputs.ml_signal }}/" \
              --auth-mode key --account-key "${{ secrets.AZURE_STORAGE_KEY }}" \
              --overwrite
          elif [ "${{ inputs.task }}" = "find-labels" ]; then
            pip install requests -q
            DROPBOX_APP_KEY="${{ secrets.DROPBOX_APP_KEY }}" \
            DROPBOX_APP_SECRET="${{ secrets.DROPBOX_APP_SECRET }}" \
            DROPBOX_REFRESH_TOKEN="${{ secrets.DROPBOX_REFRESH_TOKEN }}" \
            python -m tools.find_labels
          else
            python -m tools.recon_layouts
          fi
      - name: Upload recon outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recon-${{ inputs.task }}-${{ github.run_id }}
          path: |
            recon_out/
            presence_out/
            fetched/
            filter_pilot_out/
            processed_out/
            shared_out/
            ml_out/
            dict_out/
            inv_out/
            patient_out/
          if-no-files-found: ignore
