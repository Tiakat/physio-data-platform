variables:
  AGE:
    definition: Age ()
    domain: demographic
    filter_method: demographic
    filter_required: 'no'
    interpolation: conditional
    normal_range: 18-100
    processing_class: scalar_physiology
    source: dictionary_v1
    unit: years
  AIR_CONS:
    definition: Air cons (L^^ISO+)
    domain: ventilator_setting_extra
    filter_method: null
    filter_required: pending
    interpolation: never
    normal_range: null
    processing_class: counter
    source: dictionary_v1
    unit: null
  APNEA_DUR:
    definition: Apn Dur (s^^ISO+)
    domain: alarm
    filter_method: null
    filter_required: pending
    interpolation: conditional
    normal_range: null
    processing_class: scalar_physiology
    source: dictionary_v1
    unit: null
  ARR:
    definition: ARR (^^ISO+)
    domain: null
    filter_method: event marker
    filter_required: 'no'
    interpolation: conditional
    normal_range: none
    processing_class: scalar_physiology
    source: dictionary_v1
    unit: event
  ART_DIA:
    definition: ART M Dias
    domain: null
    filter_method: damping detection; reject <15 or >200 mmHg
    filter_required: 'yes'
    interpolation: conditional
    normal_range: 60-90
    processing_class: scalar_physiology
    source: dictionary_v1
    unit: mmHg
  ART_MEAN:
    definition: ART M
    domain: null
    filter_method: derived from SYS/DIA; reject if SYS<DIA
    filter_required: 'yes'
    interpolation: conditional
    normal_range: 65-110
    processing_class: scalar_physiology
    source: dictionary_v1
    unit: mmHg
  ART_SYS:
    definition: ART M Sys
    domain: null
    filter_method: damping detection (square wave test); reject <30 or >300 mmHg
    filter_required: 'yes'
    interpolation: conditional
    normal_range: 90-140
    processing_class: scalar_physiology
    source: dictionary_v1
    unit: mmHg
