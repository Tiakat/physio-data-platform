    definition: Audio pause (^^ISO+)
    domain: alarm
    filter_method: none
    filter_required: 'no'
    interpolation: never
    normal_range: null
    processing_class: event
    source: dictionary_v1
    unit: N/A
  BIS:
    definition: BIS (^^ISO+)
    domain: physiological_signal
    filter_method: SQI gate; reject if SQI<50; EMG artifact rejection
    filter_required: 'yes'
    interpolation: conditional
    normal_range: 40-60 (surgical anesthesia)
    processing_class: scalar_physiology
    source: dictionary_v1
    unit: index (0-100)
  CBS_HOSE:
    definition: Cbs+hose (mL/hpa^^ISO+)
    domain: ventilator_setting_extra
    filter_method: none; rolling median 3-5 for visualization only
    filter_required: 'no'
    interpolation: 'no'
    normal_range: null
    processing_class: ventilator
    source: dictionary_v1
    unit: mL/hPa
  CHOSE:
    definition: Chose (mL/hpa^^ISO+)
    domain: ventilator_setting
    filter_method: none
    filter_required: 'no'
    interpolation: 'no'
    normal_range: null
    processing_class: ventilator
    source: dictionary_v1
    unit: mL/hPa
  CVP:
    definition: CVP M
    domain: null
    filter_method: reject <0 or >30 mmHg; respiratory variation check
    filter_required: 'yes'
    interpolation: conditional
    normal_range: 2-8
    processing_class: scalar_physiology
    source: dictionary_v1
    unit: mmHg
  DES_CONS:
    definition: Des cons ()
    domain: ventilator_setting_extra
    filter_method: consumption total
    filter_required: 'no'
    interpolation: never
    normal_range: null
    processing_class: counter
