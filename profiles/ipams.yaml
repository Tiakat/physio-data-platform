# IPAMS. Radial versus brachial invasive arterial pressure.
# Layout measured in the archive on 20 Aug 2026:
#   RawData/<n>/ExtractedData/{Infinity, BetterCare, NOL, Photos}
# 38 patients, 26.69 GB.

project:
  code: IPAMS
  name: Invasive pressure radial versus brachial
  organised_by: patient          # patient | device
  retention_days: 3650

# How to turn an archive path into project, participant, session, device.
layout:
  patient_dir_regex: '^(?P<patient>\d+)$'
  patient_code_format: "P-{patient:0>4}"
  device_dir_map:                # folder name, case insensitive, to device code
    infinity: infinity
    bettercare: bettercare
    "better care": bettercare
    nol: nol
    bis: bis
    photos: other
    remi: pump
    propofol: pump

# What the platform does with each file type.
tiers:
  A_parsed:
    - pattern: "*.infinity.data.*.csv"
      device: infinity
      parser: infinity
    - pattern: "1.2.826.*.csv"
      device: bettercare
      parser: bettercare
    - pattern: "*_ExcelData*.csv"
      device: nol
      parser: nol_medasense
    - pattern: "Perf_*.csv"
      device: pump
      parser: pump
  B_kept:                        # stored, checksummed, indexed, not parsed
    - "*.med"
    - "*.enc"
    - "*.ara"
    - "*.o_a"
    - "*.m_a"
    - "*.pdf"
    - "*.jpeg"
    - "*.jpg"
    - "*.png"
  C_ignored:
    - ".DS_Store"
    - "Thumbs.db"
    - "~$*"
    - "*.tmp"

# Coverage. Which devices an analysis may require. Used by the cohort filter,
# never used to reject a patient at ingestion.
coverage:
  expected: [infinity, bettercare]
  primary_analysis_requires: [infinity, bettercare]

# Per device parsing rules.
devices:

  infinity:
    delimiter: ";"
    encoding: "utf-8"
    time:
      column: "OBSERVATION_DATETIME"
      format: "%Y%m%d%H%M%S"
      timezone: "America/Montreal"
    keep_variables: [ART_SYS, ART_DIA, ART_MEAN, PA_SYS, PA_DIA, PA_MEAN,
                     NBP_SYS, NBP_MEAN, HR, SPO2, ETCO2, CVP, MAC, ET_SEVO, ET_DES]
    required_variables: [ART_MEAN]
    expected_interval_s: 0.005

  bettercare:
    delimiter: ";"
    encoding: "utf-8"
    time:
      column: "Time (msecs)"
      kind: "elapsed_ms"
      # BetterCare carries no clock inside the file. The start time is in the
      # filename component 1<YYMMDD><HHMMSS><ms>. Verified against Infinity in
      # 23 dual recorded patients: median residual lag 4 seconds.
      start_from_filename: true
      start_regex: '\.(1\d{15})\.'
      timezone: "America/Montreal"
    # Native BetterCare resolution is preserved at ~200 Hz during ingestion.
    keep_variables: [ART_SYS, ART_DIA, ART_MEAN, PA_SYS, PA_DIA, PA_MEAN, HR, SPO2, CVP]
    required_variables: [ART_MEAN]
    expected_interval_s: 0.005

  nol:
    parser_options:
      block_header_row: 2        # second header row starts the time series block
      demographics_rows: [0, 1]
    delimiter: ","
    encoding: "utf-8"
    time:
      column: "Abs Time Vector"
      format: "%d-%b-%Y %H:%M:%S"
      timezone: "America/Montreal"
    keep_variables: [NOL, HR]
    required_variables: [NOL]
    expected_interval_s: 5

  pump:
    delimiter: ";"
    encoding: "utf-8"
    kind: event                  # not a regular time series
    keep_variables: []

# Quality control thresholds. Each becomes a flag, not a score.
quality:
  min_duration_minutes: 20
  max_missing_fraction: 0.40
  flat_signal_seconds: 300
  held_channel_seconds: 10       # the check that caught the 149 s BetterCare refresh
  max_gap_seconds: 60
  rate_tolerance: 0.25           # observed interval may differ from expected by 25 percent

# Preprocessing. Artefact rules are off by default and are a sensitivity analysis.
preprocess:
  drop_all_empty_rows: true
  apply_physiological_mask: false
  median_filter_window: 3

# Analyses offered for this project in the researcher interface.
analyses:
  - id: gradient
    label: Radial to brachial pressure gradient
    kind: paired_difference
    pairs:
      - [ART_MEAN, PA_MEAN, 10]   # variable a, variable b, threshold mmHg
      - [ART_SYS,  PA_SYS,  25]
      - [ART_DIA,  PA_DIA,  10]
    requires: [infinity]
