# Template: copy to <project-name>.yaml and fill in. Every project gets its own
# file; the pipeline code stays shared. See intraop-eeg.yaml for an example.

# Unique project id (used in directory names and the website feed).
project: my-project
description: "One-line description of the project / cohort."
version: 1

dropbox:
  # Folder inside Dropbox where this project's raw files live.
  source_dir: "/Projets actifs/my-project/raw"
  # Which files to ingest (fnmatch pattern).
  file_pattern: "*.csv"
  recursive: true

# Local staging area for downloaded raw files (and the ingest manifest).
staging_dir: "./staging"

# Signal description (used for validation and the website feed).
sampling_rate_hz: 200.0
channels: ["ECG", "ABP"]

processing:
  # Adapter that processes one patient: "module:function".
  # Signature: process_patient(raw_path, cfg, out_dir, log) -> dict
  adapter: "adapters.my_project:process_patient"
  # Stream raw files in chunks of this many seconds (for multi-hour recordings).
  chunk_seconds: 600.0
  # Fixed seed so every run is reproducible.
  seed: 0

outputs:
  # Parquet store root. Layout: <root>/<project>/<config_fingerprint>/<patient>/
  root: "./processed"
  write_clean_signals: true
  write_features: true

website:
  # Directory the lab website reads. Only aggregated/de-identified content
  # goes here.
  feed_dir: "./website"
  figures: []

# Free-form notes: file-naming conventions, filter settings, schema quirks...
notes: {}
